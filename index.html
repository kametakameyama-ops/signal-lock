<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="twitter:card" content="summary_large_image" />
<meta property="og:url" content="https://github.io" />
<meta property="og:title" content="SIGNAL LOCK" />
<meta property="og:description" content="動き回る数字の中から、指定された番号だけを制限時間内にタップするゲーム。" />
<meta property="og:image" content="https://github.iotwitter-card.JPG" />

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>SIGNAL LOCK</title>
<style>
:root{
  --bg: #12141a;
  --panel: #191c23;
  --line: #2b2f38;
  --accent: #4fa3a8;
  --bad: #c9605f;
  --good: #6fa87c;
  --text: #dcdfe3;
  --sub: #767c86;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
  margin:0; padding:0; height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  overflow:hidden;
  touch-action:manipulation;
  user-select:none;
}
.num{ font-family:"Courier New",Consolas,monospace; }

#app{
  height:100%;
  display:flex;
  flex-direction:column;
  max-width:520px;
  margin:0 auto;
  position:relative;
}

header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  padding:14px 16px 6px;
  gap:12px;
}
.target-block{ display:flex; flex-direction:column; gap:6px; flex:1 1 auto; min-width:0; }
.target-label{ font-size:11px; letter-spacing:2px; color:var(--sub); }
.target-badges{ display:flex; flex-wrap:wrap; gap:6px; }
.signal-badge{
  min-width:32px; height:32px;
  padding:0 6px;
  border-radius:6px;
  background:#1e222a;
  border:1px solid var(--accent);
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700;
  color:var(--accent);
  flex-shrink:0;
}
.signal-badge.found{
  border-color:var(--good);
  color:var(--good);
  opacity:0.5;
}
.hud{ display:flex; gap:16px; text-align:right; flex-shrink:0; }
.hud-item .hud-label{ font-size:10px; letter-spacing:1px; color:var(--sub); margin-bottom:2px; }
.hud-item .hud-value{ font-size:18px; font-weight:700; }
#countdownVal{ color:#c99a4f; }
#countdownVal.danger{ color:var(--bad); }

.pips{ display:flex; gap:5px; justify-content:center; padding:2px 16px 10px; }
.pip{ width:15px; height:3px; background:var(--line); }
.pip.done{ background:var(--good); }
.pip.current{ background:var(--accent); }

#arenaWrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:4px 16px 16px; min-height:0; }
#arena{
  position:relative;
  width:min(100%,480px);
  aspect-ratio:1/1;
  max-height:100%;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:6px;
  overflow:hidden;
}
.chip{
  position:absolute;
  width:44px; height:44px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:#232830;
  border:1px solid #3a4048;
  color:var(--text);
  font-weight:700; font-size:15px;
  cursor:pointer;
  will-change:transform;
}
.chip:active{ transform:scale(0.9); }
.chip.wrong{ border-color:var(--bad); animation:shake .25s; }
.chip.correct{ border-color:var(--good); transition:opacity .35s; }
.chip.correct.fade{ opacity:0; }
@keyframes shake{
  0%,100%{ transform:translateX(0); }
  30%{ transform:translateX(-3px); }
  70%{ transform:translateX(3px); }
}

.overlay{
  position:absolute; inset:0;
  background:rgba(10,11,14,0.92);
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:16px;
  padding:24px;
  text-align:center;
  z-index:10;
}
.overlay.hidden{ display:none; }
.overlay h1{ font-size:24px; margin:0; letter-spacing:1px; }
.overlay h1.accent{ color:var(--accent); }
.overlay h1.warn{ color:var(--bad); }
.overlay h1.win{ color:var(--good); }
.overlay p{ color:var(--sub); margin:0; font-size:14px; line-height:1.6; max-width:320px; }
.overlay .time-readout{ font-family:"Courier New",monospace; font-size:15px; color:var(--text); }
.result-table{
  font-family:"Courier New",monospace;
  font-size:13px;
  width:100%; max-width:280px;
  max-height:34vh;
  overflow-y:auto;
  border-top:1px solid var(--line);
  padding-top:8px;
}
.result-table .row{ display:flex; justify-content:space-between; padding:3px 4px; color:var(--sub); }
.result-table .row span:last-child{ color:var(--text); }
.total-row{
  display:flex; justify-content:space-between;
  width:100%; max-width:280px;
  font-family:"Courier New",monospace;
  font-size:17px; font-weight:700;
  border-top:1px solid var(--line);
  padding-top:10px;
  color:var(--good);
}
button.btn{
  font-weight:600; font-size:16px;
  padding:12px 30px;
  border-radius:4px;
  border:1px solid var(--accent);
  cursor:pointer;
  background:var(--accent);
  color:#0c1214;
}
button.btn:active{ opacity:0.8; }
button.btn.secondary{ background:transparent; color:var(--text); border:1px solid var(--line); }

footer{ padding:8px 16px 18px; text-align:center; color:var(--sub); font-size:11px; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="target-block">
      <span class="target-label">対象 <span id="targetCount" class="num">×1</span></span>
      <div class="target-badges num" id="targetBadges"></div>
    </div>
    <div class="hud">
      <div class="hud-item">
        <div class="hud-label">経過</div>
        <div class="hud-value num" id="elapsedVal">0.0s</div>
      </div>
      <div class="hud-item">
        <div class="hud-label">残り</div>
        <div class="hud-value num" id="countdownVal">10.0s</div>
      </div>
    </div>
  </header>

  <div class="pips" id="pips"></div>

  <div id="arenaWrap">
    <div id="arena">
      <div class="overlay" id="ovStart">
        <h1 class="accent">SIGNAL LOCK</h1>
        <p>上に出た番号と同じ数字を、動き回るチップの中から探してタップ。ラウンドごとに対象が1つ増える。全10ラウンド、制限時間切れで終了。</p>
        <button class="btn" id="btnStart">スタート</button>
      </div>
      <div class="overlay hidden" id="ovClear">
        <h1 class="win">CLEAR</h1>
        <p class="time-readout" id="clearRoundTime"></p>
        <button class="btn" id="btnNext">次へ</button>
      </div>
      <div class="overlay hidden" id="ovGameOver">
        <h1 class="warn">GAME OVER</h1>
        <p id="gameOverInfo"></p>
        <button class="btn" id="btnRetry">最初からやり直す</button>
      </div>
      <div class="overlay hidden" id="ovWin">
        <h1 class="win">ALL CLEAR</h1>
        <div class="result-table" id="resultTable"></div>
        <div class="total-row"><span>TOTAL</span><span id="totalTime"></span></div>
        <button class="btn secondary" id="btnRestartWin">もう一度</button>
      </div>
    </div>
  </div>

  <footer>ROUND <span id="roundLabel" class="num">0</span> / 10</footer>
</div>

<script>
(function(){
  const conf = {
    totalRounds: 10,
    decoyCount: 10,
    numMin: 1,
    numMax: 50,
    baseCountdown: 10,
    countdownStep: 5,
    chipRadius: 22,
    minSpeed: 60,
    maxSpeed: 130
  };

  const arena = document.getElementById('arena');
  const targetBadgesEl = document.getElementById('targetBadges');
  const targetCountEl = document.getElementById('targetCount');
  const elapsedValEl = document.getElementById('elapsedVal');
  const countdownValEl = document.getElementById('countdownVal');
  const roundLabelEl = document.getElementById('roundLabel');
  const pipsEl = document.getElementById('pips');

  const ovStart = document.getElementById('ovStart');
  const ovClear = document.getElementById('ovClear');
  const ovGameOver = document.getElementById('ovGameOver');
  const ovWin = document.getElementById('ovWin');

  let round = 0;
  let targetValues = [];
  let foundValues = new Set();
  let numbers = [];
  let elapsed = 0;
  let countdown = conf.baseCountdown;
  let roundActive = false;
  let rafId = null;
  let lastTime = null;
  let roundTimes = [];
  let areaW = 0, areaH = 0;

  function buildPips(){
    pipsEl.innerHTML = '';
    for(let i=1;i<=conf.totalRounds;i++){
      const d = document.createElement('div');
      d.className = 'pip';
      pipsEl.appendChild(d);
    }
  }

  function updatePips(){
    [...pipsEl.children].forEach((el,idx)=>{
      const i = idx+1;
      el.classList.toggle('done', i < round);
      el.classList.toggle('current', i === round);
    });
  }

  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function measureArena(){
    const r = arena.getBoundingClientRect();
    areaW = r.width; areaH = r.height;
  }

  function clearChips(){
    numbers.forEach(n=> n.el.remove());
    numbers = [];
  }

  function pickTargetValues(count){
    const values = new Set();
    while(values.size < count) values.add(randInt(conf.numMin, conf.numMax));
    return [...values];
  }

  function generateNumbers(){
    clearChips();
    measureArena();
    const used = new Set(targetValues);
    const decoys = [];
    while(decoys.length < conf.decoyCount){
      const v = randInt(conf.numMin, conf.numMax);
      if(!used.has(v)){ used.add(v); decoys.push(v); }
    }
    const arr = [
      ...targetValues.map(v=>({ value:v, isTarget:true })),
      ...decoys.map(v=>({ value:v, isTarget:false }))
    ];
    for(let i=arr.length-1;i>0;i--){
      const j = randInt(0,i);
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    const R = conf.chipRadius;
    arr.forEach(item=>{
      const el = document.createElement('div');
      el.className = 'chip num';
      el.textContent = item.value;
      arena.appendChild(el);
      const x = randInt(R, Math.max(R, areaW - R));
      const y = randInt(R, Math.max(R, areaH - R));
      const speed = randInt(conf.minSpeed, conf.maxSpeed);
      const angle = Math.random()*Math.PI*2;
      const n = {
        el, value: item.value, isTarget: item.isTarget,
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        r: R
      };
      el.style.transform = `translate(${x-R}px, ${y-R}px)`;
      el.addEventListener('pointerdown', ()=> onTapNumber(n));
      numbers.push(n);
    });
  }

  function moveNumbers(dt){
    numbers.forEach(n=>{
      n.x += n.vx*dt;
      n.y += n.vy*dt;
      if(n.x - n.r < 0){ n.x = n.r; n.vx *= -1; }
      if(n.x + n.r > areaW){ n.x = areaW - n.r; n.vx *= -1; }
      if(n.y - n.r < 0){ n.y = n.r; n.vy *= -1; }
      if(n.y + n.r > areaH){ n.y = areaH - n.r; n.vy *= -1; }
      n.el.style.transform = `translate(${n.x-n.r}px, ${n.y-n.r}px)`;
    });
  }

  function fmt(t){ return t.toFixed(1) + 's'; }

  function renderTargetBadges(){
    targetBadgesEl.innerHTML = '';
    targetCountEl.textContent = '×' + targetValues.length;
    targetValues.forEach(v=>{
      const b = document.createElement('div');
      b.className = 'signal-badge';
      b.textContent = v;
      b.classList.toggle('found', foundValues.has(v));
      targetBadgesEl.appendChild(b);
    });
  }

  function updateHUD(){
    elapsedValEl.textContent = fmt(elapsed);
    countdownValEl.textContent = fmt(Math.max(0,countdown));
    countdownValEl.classList.toggle('danger', countdown <= 5);
    roundLabelEl.textContent = round;
    renderTargetBadges();
    updatePips();
  }

  function tick(time){
    if(!roundActive) return;
    if(lastTime === null) lastTime = time;
    const dt = Math.min(0.05, (time - lastTime)/1000);
    lastTime = time;
    elapsed += dt;
    countdown -= dt;
    if(countdown <= 0){
      countdown = 0;
      updateHUD();
      endGameOver();
      return;
    }
    moveNumbers(dt);
    updateHUD();
    rafId = requestAnimationFrame(tick);
  }

  function startRound(r){
    round = r;
    targetValues = pickTargetValues(round);
    foundValues = new Set();
    countdown = conf.baseCountdown + (round - 1) * conf.countdownStep;
    elapsed = 0;
    lastTime = null;
    roundActive = true;
    hideAllOverlays();
    generateNumbers();
    updateHUD();
    rafId = requestAnimationFrame(tick);
  }

  function onTapNumber(n){
    if(!roundActive) return;
    if(n.isTarget && !foundValues.has(n.value)){
      foundValues.add(n.value);
      n.el.classList.add('correct');
      n.el.style.pointerEvents = 'none';
      numbers = numbers.filter(x => x !== n);
      renderTargetBadges();
      requestAnimationFrame(()=> n.el.classList.add('fade'));
      setTimeout(()=> n.el.remove(), 400);
      if(foundValues.size === targetValues.length){
        roundActive = false;
        cancelAnimationFrame(rafId);
        roundTimes.push(elapsed);
        if(round === conf.totalRounds) showWin();
        else showRoundClear();
      }
    } else {
      n.el.classList.remove('wrong');
      void n.el.offsetWidth;
      n.el.classList.add('wrong');
      setTimeout(()=> n.el.classList.remove('wrong'), 300);
    }
  }

  function endGameOver(){
    roundActive = false;
    cancelAnimationFrame(rafId);
    document.getElementById('gameOverInfo').textContent =
      `ラウンド ${round} / ${conf.totalRounds} でタイムアウト。`;
    show(ovGameOver);
  }

  function showRoundClear(){
    document.getElementById('clearRoundTime').textContent =
      `ラウンド ${round} クリア　タイム: ${fmt(elapsed)}`;
    show(ovClear);
  }

  function showWin(){
    const table = document.getElementById('resultTable');
    table.innerHTML = '';
    let total = 0;
    roundTimes.forEach((t,i)=>{
      total += t;
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span>ROUND ${i+1}</span><span>${fmt(t)}</span>`;
      table.appendChild(row);
    });
    document.getElementById('totalTime').textContent = fmt(total);
    show(ovWin);
  }

  function hideAllOverlays(){
    [ovStart, ovClear, ovGameOver, ovWin].forEach(o=> o.classList.add('hidden'));
  }
  function show(ov){
    hideAllOverlays();
    ov.classList.remove('hidden');
  }

  document.getElementById('btnStart').addEventListener('click', ()=>{
    buildPips();
    roundTimes = [];
    startRound(1);
  });
  document.getElementById('btnNext').addEventListener('click', ()=> startRound(round+1));
  document.getElementById('btnRetry').addEventListener('click', ()=>{
    roundTimes = [];
    startRound(1);
  });
  document.getElementById('btnRestartWin').addEventListener('click', ()=>{
    roundTimes = [];
    startRound(1);
  });

  buildPips();
  window.addEventListener('resize', ()=>{ if(roundActive) measureArena(); });
})();
</script>
</body>
</html>
